<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Word Assistant</title>
  
  <!-- Office and Third-Party Libraries -->
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
  
  <!-- External Stylesheet -->
  <link rel="stylesheet" href="taskpane.css" />
</head>
<body>

  <!-- Chat conversation area -->
  <div id="chat-box">
    <div class="msg assistant">שלום! איך אפשר לעזור לך?</div>
  </div>

  <!-- User input and controls container -->
  <div id="input-container">
    <textarea id="prompt-input" placeholder="הקלידי בקשה... (לחצי Enter לשליחה)"></textarea>

    <div class="actions-row">
      <label for="doc-upload" class="file-upload-btn">
        📎 העלאת מסמך
      </label>
      <input type="file" id="doc-upload" style="display: none;" accept=".txt,.docx,.pdf,.json,.md" />

      <button id="send-btn">שלח</button>
    </div>

    <!-- Attached document badge / preview card -->
    <div id="file-attached-card" style="display: none;">
      <div class="file-info">
        <span class="file-icon">📄</span>
        <div class="file-text">
          <span id="attached-file-name" class="file-name"></span>
          <span id="attached-file-size" class="file-size"></span>
        </div>
      </div>
      <button id="remove-file-btn" class="remove-btn" title="הסר קובץ" type="button">✕</button>
    </div>

    <!-- Loading spinner indicator (hidden by default) -->
    <div id="loadingIndicator" style="display: none;">
      <div class="loader"></div>
      <p>טוען תשובה...</p>
    </div>

    <div id="chatResponse"></div>
  </div>

  <script src="taskpane.js"></script>
</body>
</html>
