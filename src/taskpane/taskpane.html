<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Word Assistant</title>
  
  <!-- Office and Third-Party Libraries -->
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script type="text/javascript" src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
  
  
  <!-- External Stylesheet -->
  <link rel="stylesheet" href="taskpane.css" />
</head>
<body>
  <!--button for opening agents sidebar-->
  <button id="open-agents-sidebar-btn" type="button"> מילוי טפסים</button>

  <!--overlay when agents sidebar is open-->
  <div id="agents-sidebar-overlay"></div>

  <!-- agents sidebar -->
  <aside id="agents-sidebar" aria-label="תפריט מילוי מסמכים אוטומטי">
    <div class="sidebar-header">
      <h3>מילוי מסמכים על ידי סוכנים</h3>
      <button id="close-agents-sidebar-btn" class="close-sidebar-btn" type="button" aria-label="סגור">&times;</button>
    </div>

    <div class="sidebar-field">
      <label for="agent-selector">בחר תבנית מסמך:</label>
      <select id="agent-selector">
        <option value="deed-of-sale-007">שטר מכר</option>
      </select>
    </div>

    <div class="sidebar-field">
      <label for="source-text">פרטי העסקה / נתונים גולמיים:</label>
      <textarea id="source-text" placeholder="הדבק כאן את הטקסט או הפרטים שהסוכן צריך לחלץ..."></textarea>
    </div>

    <button id="run-agent-btn" type="button">הפעל סוכן ומלא מסמך</button>

    <div id="agent-status"></div>
  </aside>

  <!-- Chat conversation area -->
  <div id="chat-box">
    <div class="msg assistant">שלום! איך אפשר לעזור לך?</div>
  </div>

  <!-- User input and controls container -->
  <div id="input-container">
    <textarea id="prompt-input" placeholder="הקלידי בקשה... (לחצי Enter לשליחה)"></textarea>

    <div class="actions-row">
      <label for="doc-upload" class="file-upload-btn">
        📎 העלאת מסמך
      </label>
      <input type="file" id="doc-upload" style="display: none;" multiple accept=".txt,.docx,.doc,.pdf,.xlsx,.xls,.json,.md" />
      <button id="send-btn" type="button">שלח</button>
    </div>

    <!-- Attached document chips container -->
    <div id="attached-files-container"></div>

    <!-- Loading spinner indicator (hidden by default) -->
    <div id="loadingIndicator" style="display: none;">
      <div class="loader"></div>
      <p>טוען תשובה...</p>
    </div>

    <div id="chatResponse"></div>
  </div>

  <script src="config-word.js"></script>
  <script src="https://yaelbard.github.io/word_addin/shared_files/system_prompt.json"></script>
  <script src="https://yaelbard.github.io/word_addin/shared_files/frontend_utils.js"></script>
  <script src="https://yaelbard.github.io/word_addin/shared_files/file_parser.js"></script>
    <script src="https://yaelbard.github.io/word_addin/shared_files/file_upload_frontend.js"></script>

  <script src="word-auth.js"></script>
  <script src="word-document.js"></script>
  <script src="api-client.js"></script>
  <script src="taskpane.js"></script>


</body>
</html>
