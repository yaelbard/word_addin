<!DOCTYPE html>
<html>
<head>
    <!-- נטען רק את MSAL כדי שידע לסגור את החלון -->
    <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
</head>
<body>
    <script>
        // MSAL מזהה אוטומטית שהוא רץ בתוך חלון קופץ (Popup)
        // הוא מעביר את המידע לחלון הראשי (Taskpane) וסוגר את עצמו
        const msalInstance = new msal.PublicClientApplication({
            auth: {
                clientId: "2603315b-9e9f-4b43-b2fd-3de9ff9c41bd", 
                authority: "https://login.microsoftonline.com/73ea3442-65e1-4556-a609-904f5d2e45ab" 
            }
        });
        
        // אתחול שמטפל בהחזרת הטוקן וסגירת החלון
        msalInstance.initialize().then(() => {
            msalInstance.handleRedirectPromise();
        });
    </script>
</body>
</html>
