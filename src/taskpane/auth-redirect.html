<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>התחברות ל-Entra ID</title>
  
  <!-- קישור לקובץ העיצוב החיצוני שלך -->
  <link rel="stylesheet" href="taskpane.css" />

  <!-- ספריות אופיס ו-MSAL -->
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
</head>
<body>

  <div id="auth-status-container">
    <div id="auth-loader"></div>
    <p id="auth-status-text">מתחבר ל-Entra ID...</p>
  </div>

<script>
  Office.onReady(async () => {
    try {
      // שליפה ישירה מה-localStorage המשותף לדומיין
      let clientId = localStorage.getItem("entra_clientId");
      let tenantId = localStorage.getItem("entra_tenantId");

      // בדיקת גיבוי מפרמטרי ה-URL אם לא נמצא ב-localStorage
      if (!clientId || !tenantId) {
        const urlParams = new URLSearchParams(window.location.search);
        clientId = clientId || urlParams.get("clientId");
        tenantId = tenantId || urlParams.get("tenantId");
      }

      // אם עדיין חסר, זורקים שגיאה ברורה
      if (!clientId || !tenantId) {
        throw new Error(`Missing Credentials! clientId: ${clientId}, tenantId: ${tenantId}`);
      }

      const cleanRedirectUri = window.location.origin + window.location.pathname;

      const msalConfig = {
        auth: {
          clientId: clientId,
          authority: `https://login.microsoftonline.com/${tenantId}`,
          redirectUri: cleanRedirectUri
        },
        cache: {
          cacheLocation: "localStorage",
          storeAuthStateInCookie: true
        }
      };

      const msalInstance = new msal.PublicClientApplication(msalConfig);
      await msalInstance.initialize();

      const authParameters = {
        scopes: ["https://cognitiveservices.azure.com/.default"]
      };

      const response = await msalInstance.handleRedirectPromise();
      if (response) {
        const statusElem = document.getElementById("auth-status-text");
        if (statusElem) statusElem.innerText = "ההתחברות הצליחה, מעביר נתונים...";
        Office.context.ui.messageParent(JSON.stringify({
          status: "success",
          token: response.accessToken
        }));
        return;
      }

      const accounts = msalInstance.getAllAccounts();
      if (accounts.length > 0) {
        try {
          const silentResponse = await msalInstance.acquireTokenSilent({
            ...authParameters,
            account: accounts[0]
          });
          Office.context.ui.messageParent(JSON.stringify({
            status: "success",
            token: silentResponse.accessToken
          }));
          return;
        } catch (silentError) {
          console.warn("Silent token acquisition failed, redirecting...", silentError);
        }
      }

      await msalInstance.loginRedirect(authParameters);

    } catch (error) {
      console.error("Auth redirect error:", error);
      const statusElem = document.getElementById("auth-status-text");
      if (statusElem) {
        statusElem.innerText = "שגיאה: " + error.message;
      }
      Office.context.ui.messageParent(JSON.stringify({
        status: "error",
        error: error.message || "Authentication failed"
      }));
    }
  });
</script>
</body>
</html>
