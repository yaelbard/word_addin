<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Authenticating...</title>
    <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
</head>
<body>
    <script>
        const msalConfig = {
            auth: {
                clientId: "2603315b-9e9f-4b43-b2fd-3de9ff9c41bd", 
                authority: "https://login.microsoftonline.com/73ea3442-65e1-4556-a609-904f5d2e45ab" 
            },
            cache: {
                cacheLocation: "localStorage",
                storeAuthStateInCookie: true
            }
        };

        const msalInstance = new msal.PublicClientApplication(msalConfig);

        msalInstance.initialize().then(() => {
            return msalInstance.handleRedirectPromise();
        }).catch((error) => {
            console.error("Popup auth error:", error);
        });
    </script>
</body>
</html>
