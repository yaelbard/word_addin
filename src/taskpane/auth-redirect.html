<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Entra ID Authentication</title>
  <link rel="stylesheet" href="taskpane.css" />

  <!-- Office.js and MSAL Browser -->
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
</head>
<body>

  <div id="auth-status-container">
    <div id="auth-loader"></div>
    <p id="auth-status-text">מתחבר ל-Entra ID...</p>
  </div>

  <script>
    // Send message back to taskpane safely
    function notifyParent(status, payload) {
      if (Office && Office.context && Office.context.ui && typeof Office.context.ui.messageParent === "function") {
        Office.context.ui.messageParent(JSON.stringify({
          status: status,
          ...(status === "success" ? { token: payload } : { error: payload })
        }));
      }
    }

    Office.onReady(async () => {
      try {
        // Extract credentials from URL params or localStorage fallback
        const urlParams = new URLSearchParams(window.location.search);
        const clientId = (window.CONFIG && window.CONFIG.clientId) ||
                         urlParams.get("clientId") ||
                         localStorage.getItem("entra_clientId");

        const tenantId = (window.CONFIG && window.CONFIG.tenantId) ||
                         urlParams.get("tenantId") ||
                         localStorage.getItem("entra_tenantId");

        if (!clientId || !tenantId) {
          throw new Error("Missing clientId or tenantId configuration.");
        }

        // שמירה לשימוש חוזר בעת חזרה ממיקרוסופט
        localStorage.setItem("entra_clientId", clientId);
        localStorage.setItem("entra_tenantId", tenantId);
        // Clean redirect URI without search queries
        const cleanRedirectUri = window.location.origin + window.location.pathname;

        const msalConfig = {
          auth: {
            clientId: clientId,
            authority: `https://login.microsoftonline.com/${tenantId}`,
            redirectUri: cleanRedirectUri
          },
          cache: {
            cacheLocation: "localStorage",
            storeAuthStateInCookie: true
          }
        };

        const msalInstance = new msal.PublicClientApplication(msalConfig);
        await msalInstance.initialize();

        const authParameters = {
          scopes: ["https://cognitiveservices.azure.com/.default"]
        };

        // Handle redirect return flow from Microsoft login page
        const response = await msalInstance.handleRedirectPromise();

        if (response && response.accessToken) {
          const statusElem = document.getElementById("auth-status-text");
          if (statusElem) statusElem.innerText = "ההתחברות הצליחה, מעביר נתונים...";
          notifyParent("success", response.accessToken);
          return;
        }

        // If no redirect response was detected, trigger the interactive login
        await msalInstance.loginRedirect(authParameters);

      } catch (error) {
        console.error("Auth redirect error:", error);
        const statusElem = document.getElementById("auth-status-text");
        if (statusElem) {
          statusElem.innerText = "שגיאה: " + error.message;
        }
        notifyParent("error", error.message || "Authentication failed");
      }
    });
  </script>
</body>
</html>
